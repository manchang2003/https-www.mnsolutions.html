<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Unique Computer Academy</title>

    
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.signup-container {
    background: rgb(253, 255, 255);
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
    text-align: center;
    width: 300px;
}

h2 {
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    width: 100%;
    padding: 10px;
    background-color: #007BFF;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: #0056b3;
}

#message {
    margin-top: 10px;
    font-size: 14px;
    color: green;
}

    </style>
</head>
<body>

    <div class="signup-container">
        <h2>Sign Up</h2>
        <form id="signupForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Password" required>
            <input type="password" id="Confirm Password" placeholder="Confirm Password" required>
            <input type="password" id="whatsapp number" placeholder="whatsapp number" required>
            
            <button type="submit">Sign Up</button>
        </form>
        <p id="message"></p>
    </div>

    <script>document.getElementById("signupForm").addEventListener("submit", function(event) {
        event.preventDefault(); // Prevent form from refreshing the page
    
        let name = document.getElementById("name").value;
        let email = document.getElementById("email").value;
        let password = document.getElementById("password").value;
    
        // Send Data to Email Using FormSubmit
        fetch("https://formsubmit.co/mcnprograming@gmail.com", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: name, email: email, password: password })
        })
        .then(response => {
            if (response.ok) {
                document.getElementById("message").textContent = "Signup successful! Check your email.";
                document.getElementById("signupForm").reset();
            } else {
                document.getElementById("message").textContent = "Error signing up. Try again.";
            }
        })
        .catch(error => {
            document.getElementById("message").textContent = "Error connecting to the server.";
        });
    });
    </script>

</body>
</html>
