<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Unique Computer Academy</title>
    <style>
        /* Global Styles */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f4f4f4;
    margin: 0;
    padding: 0;
}

/* Reset Container Styles */
.reset-container {
    max-width: 400px;
    margin: 100px auto;
    padding: 20px;
    background: white;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

/* Header Styles */
h2 {
    text-align: center;
    color: #003366;
}

/* Form Elements */
label {
    display: block;
    margin: 10px 0 5px;
}

input[type="email"] {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    transition: border-color 0.3s ease;
}

input:focus {
    border-color: #003366;
    outline: none;
}

/* Button Styles */
button {
    width: 100%;
    padding: 10px;
    background-color: #003366;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: #0055b3;
}

/* Error Message Styles */
.error-message {
    color: red;
    font-size: 0.9em;
}

/* Success Message Styles */
.success-message {
    text-align: center;
    color: green;
    margin-top: 20px;
}

/* Responsive Styles */
@media (max-width: 600px) {
    .reset-container {
        padding: 15px;
    }
}
    </style>
</head>
<body>

    <div class="reset-container">
        <h2>Reset Your Password</h2>
        <form id="resetForm">
            <label for="email"><b>Email</b></label>
            <input type="email" placeholder="Enter your registered email" name="email" id="email" required>
            <span id="emailError" class="error-message"></span>

            <button type="submit" id="resetButton">Send Reset Link</button>
        </form>
        <p>Remembered your password? <a href="login.html">Login here</a></p>
    </div>

    <div id="successMessage" class="success-message" style="display:none;">
        <p>A reset link has been sent to your email address.</p>
    </div>

    <script>document.addEventListener('DOMContentLoaded', () => {
    const resetForm = document.getElementById('resetForm');
    const emailInput = document.getElementById('email');
    const emailError = document.getElementById('emailError');
    const resetButton = document.getElementById('resetButton');
    const successMessage = document.getElementById('successMessage');

    // Form Submission
    resetForm.addEventListener('submit', (e) => {
        e.preventDefault();
        
        // Validate Email
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(emailInput.value)) {
            emailError.textContent = 'Please enter a valid email address.';
            return;
        } else {
            emailError.textContent = '';
        }

        // Simulate sending reset link (replace with actual logic)
        resetButton.textContent = 'Sending...';
        setTimeout(() => {
            resetButton.textContent = 'Send Reset Link';
            successMessage.style.display = 'block';
            emailInput.value = ''; // Clear the input field
        }, 2000);
    });
});</script>
</body>
</html>
