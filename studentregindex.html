<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Unique Computer Academy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin: 50px;
        }
        .container {
            background: white;
            padding: 20px;
            max-width: 400px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }
        input, select {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            background: #28a745;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Register for Unique Computer Academy</h2>
        <form id="registrationForm">
            <input type="text" id="fullName" placeholder="Full Name" required><br>
            <input type="tel" id="phoneNumber" placeholder="Phone Number" required><br>
            <input type="email" id="email" placeholder="Email Address" required><br>
            <select id="course">
                <option value="Web Development">Web Development</option>
                <option value="Graphics Design">Graphics Design</option>
                <option value="Computer Basics">Computer Basics</option>
            </select><br>
            <button type="submit">Register</button>
        </form>
    </div>

    <script>
        document.getElementById("registrationForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Prevent default form submission

            // Get form values
            const name = document.getElementById("fullName").value;
            const phone = document.getElementById("phoneNumber").value;
            const email = document.getElementById("email").value;
            const course = document.getElementById("course").value;

            // Encode the data for WhatsApp
            const message = `New Registration for Unique Computer Academy:
            %0A👤 Name: ${name}
            %0A📞 Phone: ${phone}
            %0A✉ Email: ${email}
            %0A📚 Course: ${course}`;

            // WhatsApp group link (Replace with your group phone number)
            const whatsappNumber = "+234911 279 5663"; // Your WhatsApp group admin number
            const whatsappLink = `https://chat.whatsapp.com/G61qIt0bDvL3LyQOkMWe3X${whatsappNumber}?text=${message}`;

            // Redirect to WhatsApp
            window.location.href = "https://chat.whatsapp.com/FWChEn5hc0A6CdFsQXFs4b";

            // Redirect back to main site after 5 seconds
            setTimeout(() => {
                window.location.href = "study.html"; // Replace with your site link
            }, 5000);
        });
    </script>

</body>
</html>
