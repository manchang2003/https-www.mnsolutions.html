<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Files from Email Cloud</title>
</head>
<body>
    <h1>Download Your Files</h1>
    <button onclick="authenticate()">Authenticate</button>
    <ul id="file-list"></ul>

    <script>
        function authenticate() {
            window.location.href = "https://drive.google.com/file/d/1y3-P3SuOJK0igkszuCwftZEgqxJoSHPk/view?usp=drive_link";
        }

        async function fetchFiles() {
            const response = await fetch("https://drive.google.com/file/d/1y3-P3SuOJK0igkszuCwftZEgqxJoSHPk/view?usp=drive_link");
            const files = await response.json();
            const list = document.getElementById("file-list");
            list.innerHTML = "";
            files.forEach(file => {
                const li = document.createElement("li");
                li.innerHTML = `${file.name} <a href="https://drive.google.com/file/d/1y3-P3SuOJK0igkszuCwftZEgqxJoSHPk/view?usp=drive_link${file.id}" download>Download</a>`;
                list.appendChild(li);
            });
        }

        window.onload = fetchFiles;
    </script>
</body>
</html>
